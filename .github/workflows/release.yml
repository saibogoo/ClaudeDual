name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected vMAJOR.MINOR.PATCH)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Verify bundle version
        run: |
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$BUNDLE_VERSION" != "${{ steps.ver.outputs.version }}" ]; then
            echo "Resources/Info.plist is $BUNDLE_VERSION but release tag is ${{ steps.ver.outputs.tag }}" >&2
            exit 1
          fi

      - name: Run proxy regression tests
        run: python3 -m unittest discover -s tests -v

      - name: Build universal .app
        run: |
          UNIVERSAL=1 tools/PackageApp.sh
          codesign --force --deep --sign - ClaudexDual.app
          codesign --verify --deep --strict --verbose=2 ClaudexDual.app

      - name: Package DMG
        run: |
          STAGE="$(mktemp -d)/ClaudexDual"
          mkdir -p "$STAGE"
          cp -R ClaudexDual.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          cp "docs/安装说明.md" "$STAGE/"
          hdiutil create -volname ClaudexDual \
            -srcfolder "$STAGE" -ov -format UDZO \
            "ClaudexDual-${{ steps.ver.outputs.tag }}.dmg"
          shasum -a 256 "ClaudexDual-${{ steps.ver.outputs.tag }}.dmg" \
            > "ClaudexDual-${{ steps.ver.outputs.tag }}.dmg.sha256"
          shasum -a 256 -c "ClaudexDual-${{ steps.ver.outputs.tag }}.dmg.sha256"

      - name: Build update manifest
        run: |
          ASSET="ClaudexDual-${{ steps.ver.outputs.tag }}.dmg"
          SHA256="$(shasum -a 256 "$ASSET" | awk '{print $1}')"
          SIZE="$(stat -f '%z' "$ASSET")"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}/$ASSET"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${{ steps.ver.outputs.tag }}"
          NOTES="$(awk -v tag="## ${{ steps.ver.outputs.tag }}" '
            $0 == tag {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md | sed -e '/^[[:space:]]*$/d')"
          if [ -z "$NOTES" ]; then
            echo "CHANGELOG.md has no section for ${{ steps.ver.outputs.tag }}" >&2
            exit 1
          fi
          jq -n \
            --arg version "${{ steps.ver.outputs.version }}" \
            --arg tag_name "${{ steps.ver.outputs.tag }}" \
            --arg title "ClaudexDual ${{ steps.ver.outputs.tag }}" \
            --arg notes "$NOTES" \
            --arg published_at "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --arg release_url "$RELEASE_URL" \
            --arg asset_name "$ASSET" \
            --arg asset_url "$DOWNLOAD_URL" \
            --argjson asset_size "$SIZE" \
            --arg asset_sha256 "$SHA256" \
            '{schema_version: 1, version: $version, tag_name: $tag_name, title: $title, notes: $notes, published_at: $published_at, release_url: $release_url, asset: {name: $asset_name, url: $asset_url, size: $asset_size, sha256: $asset_sha256}}' \
            > latest.json
          jq -e '.schema_version == 1 and (.asset.sha256 | length == 64)' latest.json

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ClaudexDual ${{ steps.ver.outputs.tag }}
          files: |
            ClaudexDual-*.dmg
            ClaudexDual-*.dmg.sha256
            latest.json
          generate_release_notes: true
          body: |
            ## ClaudexDual ${{ steps.ver.outputs.tag }}

            macOS 桌面应用：管理 Claude Desktop 与 Codex 的第三方推理配置、模型映射和隔离实例。

            Codex 上游需要兼容 OpenAI Responses API（`/v1/responses`）。

            ### 安装
            1. 下载下方的 `ClaudexDual-${{ steps.ver.outputs.tag }}.dmg`
            2. 打开后将 `ClaudexDual.app` 拖入「应用程序」
            3. 应用尚未公证，首次打开如被拦截，执行：

            ```bash
            sudo xattr -r -d com.apple.quarantine /Applications/ClaudexDual.app
            ```

            应用内“关于 → 在线升级”会检查 GitHub Release，并在校验安装包 SHA-256 后自动替换应用并重启；失败时回退到手动安装。

            通用二进制（Apple Silicon + Intel），需要 macOS 13.0+。
